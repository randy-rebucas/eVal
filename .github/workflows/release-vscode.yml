name: Release VS Code extension

# Push a tag matching the extension version, e.g. `git tag vscode-v0.1.0 && git push origin vscode-v0.1.0`.
# Secrets: VSCE_PAT (Azure DevOps PAT, scope Marketplace → Manage, all organizations) and OVSX_PAT (open-vsx.org).
on:
  push:
    tags: ["vscode-v*"]

permissions:
  contents: write  # attach the .vsix to the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vscode-marketplace
    defaults:
      run:
        working-directory: ide/vscode
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - name: Tag matches package.json version
        run: |
          want="vscode-v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "Tag $GITHUB_REF_NAME does not match $want"; exit 1; }
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Package
        run: npm run package
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run publish:marketplace
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npm run publish:openvsx
      - name: Attach .vsix to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" eval-auditor.vsix --repo "$GITHUB_REPOSITORY" --title "VS Code extension ${GITHUB_REF_NAME#vscode-v}" --notes-file CHANGELOG.md
