name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,ai]"
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: bandit -r eval_app eval_engine scripts -c pyproject.toml
      - name: Tests
        env:
          EVAL_OSV_ENABLED: "0"
          EVAL_REGISTRY_CHECK_ENABLED: "0"
        run: pytest
      - name: Models and migrations in sync
        env:
          EVAL_ENV: testing
          FLASK_APP: wsgi
          TEST_DATABASE_URL: sqlite:///${{ runner.temp }}/ci.db
        run: flask db upgrade && flask db check
