[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-auditor"
version = "0.1.0"
description = "eVal (electronic validator): AI Engineering Auditor. AI generates code. eVal verifies it."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "Flask>=3.0,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-Migrate>=4.0,<5",
  "Flask-Login>=0.6.3,<1",
  "Flask-WTF>=1.2,<2",
  "SQLAlchemy>=2.0.30,<3",
  "psycopg[binary]>=3.1,<4",
  "celery[redis]>=5.4,<6",
  "redis>=5.0,<6",
  "GitPython>=3.1.43,<4",
  "cryptography>=42",
  "requests>=2.32,<3",
  "email-validator>=2.1",
  "gunicorn>=22; platform_system != 'Windows'",
]

[project.optional-dependencies]
analyzers = [
  "ruff>=0.6",
  "bandit>=1.7.9",
  "mypy>=1.11",
]
ai = [
  "anthropic>=0.40",
  "openai>=1.50",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
  "bandit>=1.7.9",
  "mypy>=1.11",
]

[project.scripts]
eval-audit = "eval_engine.cli:main"

[tool.setuptools.packages.find]
include = ["eval_engine*", "eval_app*"]

[tool.setuptools.package-data]
eval_engine = ["ai/prompts/*.txt", "rules/*.json"]
eval_app = ["templates/**/*", "static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RET"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607", "B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "postgres: requires a PostgreSQL TEST_DATABASE_URL",
  "tools: requires external analyzer binaries (ruff/bandit)",
]
filterwarnings = ["ignore::DeprecationWarning:celery.*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
