# Local / single-host deployment. For development, `docker compose up -d postgres redis` is enough and the
# app can run from a virtualenv (see README).
name: eval

x-env: &env
    DATABASE_URL: postgresql+psycopg://eval:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/eval
    REDIS_URL: redis://redis:6379/0
    EVAL_ENV: production
    EVAL_DATA_DIR: /data
    EVAL_WORK_DIR: /work
    EVAL_TRIVY_CACHE_DIR: /trivy-cache
    # For plain-http local use set EVAL_SECURE_COOKIES=false in .env; keep true behind TLS.

x-app: &app
  build: .
  env_file: .env
  environment: *env
  volumes:
    - eval-data:/data
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: eval
    ports: ["127.0.0.1:55450:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval -d eval"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56390:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    <<: *app
    command: ["flask", "db", "upgrade"]
    restart: "no"

  web:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["celery", "-A", "eval_app.celery_worker:celery", "worker", "--loglevel=INFO",
              "--concurrency=2", "--max-tasks-per-child=20", "-Q", "audits"]
    # Analyzers run untrusted repository content through static tools; constrain the container.
    read_only: true
    tmpfs: ["/tmp:size=1g,mode=1777", "/work:size=4g,uid=10001,gid=10001,mode=0700"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0
    # The worker only reads uploads; analyzers must not be able to modify other tenants' archives.
    volumes:
      - eval-data:/data:ro
      - trivy-cache:/trivy-cache
    depends_on:
      migrate: { condition: service_completed_successfully }

  scheduler:
    <<: *app
    # Celery beat: enqueues scheduled re-audits every 15 minutes (the worker runs them). Exactly one instance.
    command: ["celery", "-A", "eval_app.celery_worker:celery", "beat", "--loglevel=INFO",
              "--schedule=/tmp/celerybeat-schedule"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Optional sandbox terminals (docs/SANDBOX.md). Not started unless you run with `--profile sandbox`.
  # It is the only service with the Docker socket, so it gets nothing else: no database, no app secrets.
  # Requires gVisor (runsc) registered with this Docker host; build the workspace image first:
  #   docker build -f sandbox/workspace.Dockerfile -t eval-sandbox-workspace:latest sandbox
  sandbox:
    profiles: ["sandbox"]
    build: { context: ., dockerfile: Dockerfile.sandbox }
    environment:
      EVAL_SANDBOX_SECRET: ${EVAL_SANDBOX_SECRET:?set EVAL_SANDBOX_SECRET in .env to use the sandbox}
      EVAL_SANDBOX_ALLOWED_ORIGINS: ${EVAL_SANDBOX_ALLOWED_ORIGINS:-http://localhost:8000}
      EVAL_SANDBOX_RUNTIME: ${EVAL_SANDBOX_RUNTIME:-runsc}
      EVAL_SANDBOX_ALLOW_RUNC: ${EVAL_SANDBOX_ALLOW_RUNC:-false}
      EVAL_SANDBOX_MAX_MINUTES: ${EVAL_SANDBOX_MAX_MINUTES:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Browsers connect here for the terminal websocket; put TLS in front (wss://) and set EVAL_SANDBOX_PUBLIC_URL.
    ports: ["127.0.0.1:8100:8100"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  eval-data:
  trivy-cache:
